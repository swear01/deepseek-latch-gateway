server:
  host: "127.0.0.1"
  port: 8080
  timeout_seconds: 120

strategy:
  mode: "latch"                  # RS-Latch sticky failover
  debounce_seconds: 1.0          # Prevents concurrent 429 thundering herd
  max_retries_per_request: 2     # Max retry attempts per in-flight request

# RS-Latch cycling pool (Key 1 -> Key 2 -> Key 1)
endpoints:
  - id: "opencode-go-1"
    name: "OpenCode Go (Account 1)"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_GO_KEY_1}"

  - id: "opencode-go-2"
    name: "OpenCode Go (Account 2)"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_GO_KEY_2}"

  # --- Future Multi-Endpoint Expansion Examples ---
  # - id: "deepseek-official"
  #   name: "DeepSeek Official API"
  #   base_url: "https://api.deepseek.com/v1"
  #   api_key: "${DEEPSEEK_API_KEY}"

# Model Aliases Mapping (optional)
models:
  aliases:
    "deepseek-chat": "deepseek-v4-flash"
    "deepseek-coder": "deepseek-v4-flash"
    "deepseek-reasoner": "deepseek-v4-pro"
