server:
  host: "127.0.0.1"
  port: 35001
  timeout_seconds: 120

# Upstream connection settings. A provider that fails (quota, credentials,
# block, 5xx, network) for one model is not contacted for that model again
# for 30 minutes.
providers:
  opencode-go-1:
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_API_KEY_1}"
    compat:
      strip_response_format: true
  opencode-go-2:
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_API_KEY_2}"
    compat:
      strip_response_format: true
  opencode-go-3:
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_API_KEY_3}"
    compat:
      strip_response_format: true
  command-code:
    base_url: "https://api.commandcode.ai/provider/v1"
    api_key: "${COMMAND_CODE_API_KEY}"
    compat:
      strip_response_format: true
      response_reasoning_field: "reasoning"
      unwrap_error: true
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENROUTER_API_KEY}"
    extra_body:
      provider:
        sort: "throughput"
        max_price:
          prompt: 0.15
          completion: 0.60
        ignore:
          - "decart"
          - "baseten"
          - "phala"
          - "mancer"
          - "wafer"
          - "io.net"
        allow_fallbacks: true

# Public model ids. Each request uses the first listed deployment that is
# not cooling down. Always name each provider's newest DeepSeek
# model, never a dated snapshot; `bun run check-latest` verifies this live.
models:
  deepseek-flash:
    - { provider: opencode-go-1, model: "deepseek-v4.1-flash" }
    - { provider: opencode-go-2, model: "deepseek-v4.1-flash" }
    - { provider: opencode-go-3, model: "deepseek-v4.1-flash" }
    - { provider: command-code, model: "deepseek/deepseek-v4.1-flash" }
    - { provider: openrouter, model: "~deepseek/deepseek-flash-latest" }
  deepseek-pro:
    - { provider: command-code, model: "deepseek/deepseek-v4-pro" }
    - { provider: openrouter, model: "~deepseek/deepseek-pro-latest" }
