server:
  host: "127.0.0.1"
  port: 35001
  timeout_seconds: 120

strategy:
  mode: "latch"
  debounce_seconds: 1.0
  max_retries_per_request: 4

# Provider/runtime settings only. Model priority and upstream model names live
# in routing.yaml so the provider definitions can be reused by multiple routes.
endpoints:
  - id: "command-code"
    name: "Command Code"
    base_url: "https://api.commandcode.ai/provider/v1"
    api_key: "${COMMAMD_CODE_API_KEY}"
    compat:
      strip_response_format: true
      response_reasoning_field: "reasoning"
      unwrap_error: true

  - id: "opencode-go-1"
    name: "OpenCode Go (Account 1)"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_API_KEY_1}"
    compat:
      strip_response_format: true

  - id: "opencode-go-2"
    name: "OpenCode Go (Account 2)"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_API_KEY_2}"
    compat:
      strip_response_format: true

  - id: "opencode-go-3"
    name: "OpenCode Go (Account 3)"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_API_KEY_3}"
    compat:
      strip_response_format: true

models:
  allow:
    - "deepseek-v4-flash"
    - "deepseek-v4-pro"
